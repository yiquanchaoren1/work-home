<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176453">
  <title>文档 · 工作间</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./document.css">
  <link rel="stylesheet" href="./pdf-viewer.css">
  <link rel="stylesheet" href="./ui-refresh.css">
  <link rel="stylesheet" href="./studio.css">
  <script type="module" src="./document.js"></script>
</head>
<body class="document-page">
  <header class="reader-topbar">
    <a class="reader-brand" href="./#notes"><span class="brand-mark">间</span><span>工作间 <small>知识库 / 文档阅读</small></span></a>
    <nav class="reader-actions" aria-label="文档操作">
      <a class="button secondary" href="./#notes">返回知识库</a>
      <button class="button secondary" id="document-download" hidden>下载文档</button>
      <a class="button primary" id="document-edit" hidden>编辑文档</a>
    </nav>
  </header>
  <main class="reader-shell" id="reader" aria-live="polite"><p class="reader-loading">正在读取本机文档……</p></main>
  <footer class="reader-footer">工作间 · 文件保存在本机，阅读从这里继续。</footer>
  <noscript>请启用 JavaScript 并启动工作间本机服务后查看文档。</noscript>
</body>
</html>
